# FlexKV radixshmem mode, a 4-node cluster sharing CPU KV over RDMA.
#
#   export FLEXKV_ENABLE_RADIXSHMEM=1
#   export FLEXKV_RADIXSHMEM_CONFIG_PATH=/etc/flexkv/radixshmem.yaml
#   export FLEXKV_CPU_LAYOUT=BLOCKFIRST
#
# This file is GLOBAL: copy it byte for byte to every node. Each node resolves
# its own IP from cluster.rpc_interface and gets its identity and rank from the
# etcd rendezvous. Only the keys a cluster must set are listed; everything else
# keeps its default. Reference: docs/radixshmem/config_zh.md

cluster:
  cluster_id: prod_a
  expected_min_nodes: 4
  num_rht_shards: 4
  registry: etcd://10.0.0.1:2379
  rpc_interface: bond0
  index_dev: mlx5_bond_0

data:
  transfer_devices: [mlx5_0, mlx5_1, mlx5_2, mlx5_3, mlx5_4, mlx5_5, mlx5_6, mlx5_7]

index:
  background_evict_ratio: 0.05
